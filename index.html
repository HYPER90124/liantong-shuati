<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="行测刷题">
<title>行测刷题 · 2026 联通行测汇编（一）</title>
<link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./assets/icon.svg">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="toprow">
      <div class="brand">
        <span class="dot"></span>
        <div>
          <div class="brand-title">行测刷题</div>
          <div class="brand-sub" id="paperTitle">2026 联通行测汇编（一）</div>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="revealBtn" title="背题模式" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <button class="icon-btn" id="themeBtn" title="切换深色模式"></button>
      </div>
    </div>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-meta">
        <span id="progressText">已答 0 / 122</span>
        <span id="accuracyText">正确率 --</span>
      </div>
    </div>
  </header>

  <main id="view" class="view"></main>

  <nav class="bottombar">
    <button class="nav-btn" id="prevBtn">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
      上一题
    </button>
    <button class="nav-btn primary" id="sheetBtn">
      <span id="sheetBtnText">答题卡</span>
      <span class="nav-count" id="navCount">1/122</span>
    </button>
    <button class="nav-btn" id="nextBtn">
      下一题
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
    </button>
  </nav>
</div>

<div class="sheet-mask" id="sheetMask" hidden>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="答题卡">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <div>
        <div class="sheet-title">答题卡</div>
        <div class="sheet-sub" id="sheetSub">共 122 题</div>
      </div>
      <button class="close-btn" id="closeSheet" aria-label="关闭">✕</button>
    </div>
    <div class="sheet-stats" id="sheetStats"></div>
    <div class="mode-row" id="modeRow">
      <button class="mode-btn active" data-mode="sequence">顺序</button>
      <button class="mode-btn" data-mode="random">随机</button>
      <button class="mode-btn" data-mode="wrong">错题</button>
      <button class="mode-btn" data-mode="marked">收藏</button>
    </div>
    <div class="legend">
      <span><i class="lg correct"></i>答对</span>
      <span><i class="lg wrong"></i>答错</span>
      <span><i class="lg none"></i>未答</span>
      <span><i class="lg current"></i>当前</span>
    </div>
    <div class="grid-scroll"><div class="grid" id="grid"></div></div>
    <div class="sheet-actions">
      <button class="ghost-btn" id="resetBtn">清空记录</button>
      <button class="ghost-btn" id="jumpWrongBtn">下一道错题</button>
    </div>
  </section>
</div>

<div class="toast" id="toast" hidden></div>

<script src="./data.js"></script>
<script src="./app.js"></script>
</body>
</html>
